name: Setup regression tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verified_head:
        description: 'Commit to validate (empty for the selected ref)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.verified_head || github.sha }}
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check setup shell scripts
        run: |
          find build_files -name '*.sh' -print0 | xargs -0 -n1 bash -n
          find build_files -name '*.sh' -print0 | xargs -0 shellcheck
          shellcheck -x build_files/build.sh
          shellcheck system_files/usr/share/ublue-os/user-setup.hooks.d/{11-vscode-extensions,12-refind-gui}.sh system_files/usr/share/ublue-os/privileged-setup.hooks.d/20-dx.sh
